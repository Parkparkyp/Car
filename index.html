<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>중고차 정산서</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    margin: 20px;
    background-color: #f5f7fa;
    color: #333;
  }
  h2 {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  form, .unit-select {
    background: #ffffff;
    padding: 20px;
    margin-top: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  label {
    display: block;
    margin-top: 15px;
    font-weight: 600;
    font-size: 0.95rem;
  }
  input, select {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    font-size: 1rem;
    border: 1px solid #ccc;
    border-radius: 6px;
    transition: border-color 0.2s;
  }
  input:focus, select:focus {
    border-color: #007BFF;
    outline: none;
  }
  .result {
    margin-top: 25px;
    font-weight: bold;
    font-size: 1.2em;
    color: #007BFF;
  }
  .radio-highlight input[type="radio"] {
    display: none;
  }
  .radio-highlight span {
    padding: 6px 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    cursor: pointer;
    margin-right: 8px;
    font-size: 0.9rem;
  }
  .radio-highlight input[type="radio"]:checked + span {
    background-color: #ffd9d9;
    color: #d60000;
    font-weight: bold;
    border-color: #d60000;
  }
  button {
    padding: 12px;
    margin-top: 20px;
    background: #28a745;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 1rem;
    cursor: pointer;
    width: 100%;
  }
  button:hover {
    background: #218838;
  }
</style>
</head>
<body>
  <h2>
    중고차 정산서
    <span>
      <label class="radio-highlight"><input type="radio" name="mode" value="brokerage" checked><span> 알선</span></label>
    </span>
  </h2>

  
<label for="deliveryDate">출고 날짜:</label>
<input type="date" id="deliveryDate">

<label for="saleDate">계약 날짜:</label>
<input type="date" id="saleDate">

<div class="unit-select" style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 20px;">
  <strong>단위:</strong>
  <label class="radio-highlight"><input type="radio" name="unit" value="won"><span> 원</span></label>
  <label class="radio-highlight"><input type="radio" name="unit" value="man" checked><span> 만원</span></label>
</div>

<label for="salePrice">판매금액:</label>
<input type="number" id="salePrice" placeholder="입력하세요">

<label for="ownerPayment">차주입금금액:</label>
<input type="number" id="ownerPayment" placeholder="입력하세요">

<div class="unit-select" style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 20px;">
  <strong>계약:</strong>
  <label class="radio-highlight"><input type="radio" name="type" value="down" checked><span> 다운계약</span></label>
  <label class="radio-highlight"><input type="radio" name="type" value="normal"><span> 정계약</span></label>
</div>



  <label for="commission">알선수수료:</label>
  <input type="number" id="commission" placeholder="입력하세요">

  <label for="serviceFee">서비스 비용:</label>
  <input type="number" id="serviceFee" placeholder="입력하세요">
</div>
<div class="result" id="profitResult">총 수익: 0원</div>

    <div id="brokerageExtras">

  <div id="customerInfo">
    <label for="customerName">손님 이름:</label>
    <input type="text" id="customerName" placeholder="입력하세요">

    <label for="customerPhone">손님 번호:</label>
    <input type="text" id="customerPhone" placeholder="입력하세요">

    <label for="customerType">손님 성향:</label>
    <input type="text" id="customerType" placeholder="입력하세요">
  </div>
</div>
<label for="adPlatform">판매 경로:</label>
    <input type="text" id="adPlatform" placeholder="입력하세요">
  <button id="saveBtn" type="button" style="margin-top:20px;">저장하기</button>

<div style="margin-top:30px;">
  <h3>저장된 목록</h3>
  <ul id="savedList"></ul>
<div id="popup" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:#fff; border-radius:12px; padding:25px 30px; box-shadow:0 10px 30px rgba(0,0,0,0.2); z-index:999; max-width:90%; width:420px; font-size:15px; line-height:1.6;">
  <div id="popupContent" style="margin-bottom: 20px;"></div>
  <button type="button" onclick="document.getElementById('popup').style.display='none'" style="padding: 10px 20px; background: linear-gradient(to right, #ff5f6d, #ffc371); color: white; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; width: 100%;">닫기</button>
</div>
</div>
</form>

  <script>
function getSelectedType() {
  const typeRadios = document.getElementsByName('type');
  return [...typeRadios].find(r => r.checked)?.value || 'down';
}
    document.addEventListener('DOMContentLoaded', function () {
      const saleTypeRadios = document.getElementsByName('saleType');
      const exportFields = ['customerType'];
      const exportRenameMap = {
        customerName: '수출업자 이름:',
        customerPhone: '수출업자 번호:'
      };
      const modeRadios = document.getElementsByName('mode');
      const formElement = document.getElementById('mainForm');
      const playTime = document.getElementById('playTime');
      const playTimeLabel = document.querySelector('label[for="playTime"]');
      const salePriceInput = document.getElementById('salePrice');
      const ownerPaymentInput = document.getElementById('ownerPayment');
      const profitResult = document.getElementById('profitResult');
      const commissionInput = document.getElementById('commission');
      const typeRadios = document.getElementsByName('type');
      const serviceFeeInput = document.getElementById('serviceFee');
      const unitRadios = document.getElementsByName('unit');

      function formatToWon(value) {
        return `${value.toLocaleString()}원`;
      }

      function getSelectedType() {
        return [...typeRadios].find(r => r.checked)?.value || 'down';
      }

      function getUnitMultiplier() {
        return [...unitRadios].find(r => r.checked)?.value === 'man' ? 10000 : 1;
      }

      function calculateProfit() {
        const multiplier = getUnitMultiplier();
        const sale = (parseFloat(salePriceInput.value) || 0) * multiplier;
        const owner = (parseFloat(ownerPaymentInput.value) || 0) * multiplier;
        const commission = (parseFloat(commissionInput.value) || 0) * multiplier;
        const serviceFee = (parseFloat(serviceFeeInput.value) || 0) * multiplier;
        let profit = sale - owner;
        if (getSelectedType() === 'normal') {
          profit *= (1 - 0.1209);
        }
        profit += commission;
        profit -= serviceFee;
        profitResult.textContent = `총 수익: ${formatToWon(Math.round(profit))}`;
      }

      function updateVisibilityBySaleType() {
        const selected = [...saleTypeRadios].find(r => r.checked)?.value;
        exportFields.forEach(id => {
          const el = document.getElementById(id);
          const label = document.querySelector(`label[for="${id}"]`);
          if (el && label) {
            const display = selected === 'export' ? 'none' : 'inline-block';
            el.style.display = display;
            label.style.display = display;
          }
        });
        ['customerName', 'customerPhone'].forEach(id => {
          const labelSpan = document.querySelector(`label[for="${id}"] span`);
          if (labelSpan) {
            labelSpan.textContent = selected === 'export' ? exportRenameMap[id] : (id === 'customerName' ? '손님 이름:' : '손님 번호:');
          }
        });
      }

      function updateFormMode() {
  const playTime = document.getElementById('playTime');
  const playTimeLabel = document.querySelector('label[for="playTime"]');
  if (playTime && playTimeLabel) {
    playTime.style.display = 'inline-block';
    playTimeLabel.style.display = 'inline-block';
  }
  const customerInfo = document.getElementById('customerInfo');
  if (customerInfo) customerInfo.style.display = 'block';
  const brokerageOnly = document.getElementById('brokerageOnly');
  if (brokerageOnly) brokerageOnly.style.display = 'block';
  const brokerageFields = document.getElementById('brokerageFields');
  if (brokerageFields) brokerageFields.style.display = 'block';
  const brokerageExtras = document.getElementById('brokerageExtras');
  if (brokerageExtras) brokerageExtras.style.display = 'block';
}

      [...saleTypeRadios, ...typeRadios, ...unitRadios, commissionInput, serviceFeeInput, salePriceInput, ownerPaymentInput, ...modeRadios].forEach(el => el.addEventListener('input', calculateProfit));
      saleTypeRadios.forEach(r => r.addEventListener('change', updateVisibilityBySaleType));
      modeRadios.forEach(r => r.addEventListener('change', updateFormMode));

      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      document.getElementById('saleDate').value = `${yyyy}-${mm}-${dd}`;
      document.getElementById('deliveryDate').value = `${yyyy}-${mm}-${dd}`;

      updateVisibilityBySaleType();
      updateFormMode();
      calculateProfit();
    });
        const saveBtn = document.getElementById('saveBtn');
      const savedList = document.getElementById('savedList');

      function loadSavedList() {
        const data = JSON.parse(localStorage.getItem('savedCars') || '[]');
        savedList.innerHTML = '';
        data.forEach((item, index) => {
  const li = document.createElement('li');
  li.innerHTML = `${item.carName} / ${item.totalProfit || 0}원 / ${item.deliveryDate}`;
  li.style.cursor = 'pointer';
  li.addEventListener('click', function(e) {
    if (!e.target.classList.contains('deleteBtn')) {
      document.getElementById('popupContent').innerHTML = `
        <ul style="padding-left: 0; list-style: none;">
          <li><strong>판매 날짜:</strong> ${item.saleDate || '-'}</li>
          <li><strong>출고일:</strong> ${item.deliveryDate || '-'}</li>
          <li><strong>플레이 시간:</strong> ${item.playTime || '-'}</li>
          <li><strong>판매 구분:</strong> ${item.saleType || '-'}</li>
          <li><strong>계약 구분:</strong> ${item.contractType || '-'}</li>
          <li><strong>차량명:</strong> ${item.carName || '-'}</li>
          <li><strong>차량번호:</strong> ${item.carNumber || '-'}</li>
          <li><strong>총 수익:</strong> ${item.totalProfit || '불명확'}원</li>
          <li><strong>알선수수료:</strong> ${item.commission || '-'}</li>
          <li><strong>서비스 비용:</strong> ${item.serviceFee || '-'}</li>
          <li><strong>차주 이름:</strong> ${item.ownerName || '-'}</li>
          <li><strong>차주 번호:</strong> ${item.ownerPhone || '-'}</li>
          <li><strong>손님 이름:</strong> ${item.customerName || '-'}</li>
          <li><strong>손님 번호:</strong> ${item.customerPhone || '-'}</li>
          <li><strong>손님 성향:</strong> ${item.customerType || '-'}</li>
          <li><strong>판매 경로:</strong> ${item.adPlatform || '-'}</li>
        </ul>`;
      document.getElementById('popup').style.display = 'block';
    }
  });
  savedList.appendChild(li);
        });
      }

      saveBtn.addEventListener('click', () => {
  const carName = document.getElementById('carName').value;
  const customerName = document.getElementById('customerName').value;
  const deliveryDate = document.getElementById('deliveryDate').value;
  const profitText = document.getElementById('profitResult').textContent.replace(/[^0-9]/g, '');
  const totalProfit = parseInt(profitText || '0');
  const carNumber = document.getElementById('carNumber').value;
  const ownerName = document.getElementById('ownerName').value;
  const ownerPhone = document.getElementById('ownerPhone').value;
  const customerPhone = document.getElementById('customerPhone').value;
  const customerType = document.getElementById('customerType').value;
  const adPlatform = document.getElementById('adPlatform').value;
  const commission = document.getElementById('commission').value;
  const serviceFee = document.getElementById('serviceFee').value;
  const contractType = getSelectedType();
  const saleType = [...document.getElementsByName('saleType')].find(r => r.checked)?.value || '-';
  const playTime = document.getElementById('playTime').value;
  const saleDate = document.getElementById('saleDate').value;

  const current = JSON.parse(localStorage.getItem('savedCars') || '[]');
  current.push({ carName, customerName, deliveryDate, totalProfit, carNumber, ownerName, ownerPhone, customerPhone, customerType, adPlatform, commission, serviceFee, contractType, saleType, playTime, saleDate });
  localStorage.setItem('savedCars', JSON.stringify(current));
  loadSavedList();
});

      loadSavedList();
</script>
</body>
</html>
