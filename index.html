
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>중고차 정산서</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: sans-serif;
      margin: 20px;
      background-color: #f9f9f9;
    }
    h2 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    form, .unit-select {
      background: #fff;
      padding: 20px;
      margin-top: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    label {
      display: inline-block;
      margin-top: 10px;
      font-weight: 600;
    }
    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .result {
      margin-top: 20px;
      font-weight: bold;
      font-size: 1.2em;
      color: #007BFF;
    }
    .radio-highlight input[type="radio"]:checked + span {
      background-color: #ffd9d9;
      color: #d60000;
      font-weight: bold;
      border-radius: 5px;
      padding: 2px 6px;
    }
  </style>
</head>
<body>
  <h2>
    중고차 정산서
    <span>
      <label class="radio-highlight"><input type="radio" name="mode" value="brokerage" checked><span> 알선</span></label>
      <label class="radio-highlight"><input type="radio" name="mode" value="purchase"><span> 매입</span></label>
    </span>
  </h2>

  <label for="saleDate">판매 날짜:</label>
  <input type="date" id="saleDate" max="2099-12-31">

  <label for="deliveryDate">출고 날짜:</label>
  <input type="date" id="deliveryDate" max="2099-12-31">

  <label for="playTime">플레이 시간:</label>
  <select id="playTime">
    <option value="">선택하세요</option>
    <option value="1">1시간</option>
    <option value="2">2시간</option>
    <option value="3">3시간</option>
    <option value="4">4시간</option>
    <option value="5">5시간</option>
    <option value="6">6시간</option>
    <option value="7">7시간</option>
    <option value="8">8시간</option>
    <option value="9">9시간</option>
    <option value="10">10시간</option>
    <option value="11">11시간</option>
    <option value="12">12시간</option>
  </select>

  <div class="unit-select" style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
    <strong>단위:</strong>
    <label class="radio-highlight"><input type="radio" name="unit" value="won"><span> 원</span></label>
    <label class="radio-highlight"><input type="radio" name="unit" value="man" checked><span> 만원</span></label>
  </div>

  <form id="mainForm">
    <label for="salePrice">판매금액:</label>
    <input type="number" id="salePrice" placeholder="입력하세요">

    <label for="ownerPayment">차주입금금액:</label>
    <input type="number" id="ownerPayment" placeholder="입력하세요">

    <div class="checkboxes" style="display: flex; gap: 10px; flex-wrap: wrap;">
      <label class="radio-highlight"><input type="radio" name="type" value="down" checked><span> 다운계약</span></label>
      <label class="radio-highlight"><input type="radio" name="type" value="normal"><span> 정계약</span></label>
    </div>

    <label for="commission">알선수수료:</label>
    <input type="number" id="commission" placeholder="입력하세요">

    <label for="serviceFee">서비스 비용:</label>
    <input type="number" id="serviceFee" placeholder="입력하세요">

    <div class="result" id="profitResult">총 수익: 0원</div>

    <label>판매 구분:</label>
    <label class="radio-highlight"><input type="radio" name="saleType" value="export"> <span>수출</span></label>
    <label class="radio-highlight"><input type="radio" name="saleType" value="brokerage" checked> <span>손님</span></label>

    <h3>거래 정보 입력</h3>
    <label for="carName">차량 이름:</label>
    <input type="text" id="carName" placeholder="입력하세요">

    <label for="carNumber">차량 번호:</label>
    <input type="text" id="carNumber" placeholder="입력하세요">

    <label for="ownerName">차주 이름:</label>
    <input type="text" id="ownerName" placeholder="입력하세요">

    <label for="ownerPhone">차주 번호:</label>
    <input type="text" id="ownerPhone" placeholder="입력하세요">

    <label for="customerName"><span>손님 이름:</span></label>
    <input type="text" id="customerName" placeholder="입력하세요">

    <label for="customerPhone"><span>손님 번호:</span></label>
    <input type="text" id="customerPhone" placeholder="입력하세요">

    <label for="customerType">손님 성향:</label>
    <input type="text" id="customerType" placeholder="입력하세요">

    <label for="adPlatform">판매 경로:</label>
    <input type="text" id="adPlatform" placeholder="입력하세요">

    <button id="saveBtn" type="button" style="margin-top:20px;">저장하기</button>

    <div style="margin-top:30px;">
      <h3>저장된 목록</h3>
      <ul id="savedList"></ul>
    </div>
  </form>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const saleTypeRadios = document.getElementsByName('saleType');
      const exportFields = ['customerType'];
      const exportRenameMap = {
        customerName: '수출업자 이름:',
        customerPhone: '수출업자 번호:'
      };
      const modeRadios = document.getElementsByName('mode');
      const formElement = document.getElementById('mainForm');
      const playTime = document.getElementById('playTime');
      const playTimeLabel = document.querySelector('label[for="playTime"]');
      const salePriceInput = document.getElementById('salePrice');
      const ownerPaymentInput = document.getElementById('ownerPayment');
      const profitResult = document.getElementById('profitResult');
      const commissionInput = document.getElementById('commission');
      const typeRadios = document.getElementsByName('type');
      const serviceFeeInput = document.getElementById('serviceFee');
      const unitRadios = document.getElementsByName('unit');
      const saveBtn = document.getElementById('saveBtn');
      const savedList = document.getElementById('savedList');

      function formatToWon(value) {
        return `${value.toLocaleString()}원`;
      }

      function getSelectedType() {
        return [...typeRadios].find(r => r.checked)?.value || 'down';
      }

      function getUnitMultiplier() {
        return [...unitRadios].find(r => r.checked)?.value === 'man' ? 10000 : 1;
      }

      function calculateProfit() {
        const multiplier = getUnitMultiplier();
        const sale = (parseFloat(salePriceInput.value) || 0) * multiplier;
        const owner = (parseFloat(ownerPaymentInput.value) || 0) * multiplier;
        const commission = (parseFloat(commissionInput.value) || 0) * multiplier;
        const serviceFee = (parseFloat(serviceFeeInput.value) || 0) * multiplier;
        let profit = sale - owner;
        if (getSelectedType() === 'normal') {
          profit *= (1 - 0.1209);
        }
        profit += commission;
        profit -= serviceFee;
        profitResult.textContent = `총 수익: ${formatToWon(Math.round(profit))}`;
      }

      function updateVisibilityBySaleType() {
        const selected = [...saleTypeRadios].find(r => r.checked)?.value;
        exportFields.forEach(id => {
          const el = document.getElementById(id);
          const label = document.querySelector(`label[for="${id}"]`);
          if (el && label) {
            const display = selected === 'export' ? 'none' : 'inline-block';
            el.style.display = display;
            label.style.display = display;
          }
        });
        ['customerName', 'customerPhone'].forEach(id => {
          const labelSpan = document.querySelector(`label[for="${id}"] span`);
          if (labelSpan) {
            labelSpan.textContent = selected === 'export' ? exportRenameMap[id] : (id === 'customerName' ? '손님 이름:' : '손님 번호:');
          }
        });
      }

      function updateFormMode() {
        const selected = [...modeRadios].find(r => r.checked)?.value;
        formElement.style.display = selected === 'brokerage' ? 'block' : 'none';
        const display = selected === 'purchase' ? 'none' : 'inline-block';
        playTime.style.display = display;
        playTimeLabel.style.display = display;
      }

      function loadSavedList() {
        const data = JSON.parse(localStorage.getItem('savedCars') || '[]');
        savedList.innerHTML = '';
        data.forEach((item, index) => {
          const li = document.createElement('li');
          li.innerHTML = `${item.carName} / ${item.customerName} / ${item.deliveryDate} <button data-index="${index}" class="deleteBtn" style="margin-left:10px;">삭제</button>`;
          savedList.appendChild(li);
        });
      }

      savedList.addEventListener('click', function(e) {
        if (e.target.classList.contains('deleteBtn')) {
          const index = e.target.getAttribute('data-index');
          const current = JSON.parse(localStorage.getItem('savedCars') || '[]');
          current.splice(index, 1);
          localStorage.setItem('savedCars', JSON.stringify(current));
          loadSavedList();
        }
      });

      saveBtn.addEventListener('click', () => {
        const carName = document.getElementById('carName').value;
        const customerName = document.getElementById('customerName').value;
        const deliveryDate = document.getElementById('deliveryDate').value;

        const current = JSON.parse(localStorage.getItem('savedCars') || '[]');
        current.push({ carName, customerName, deliveryDate });
        localStorage.setItem('savedCars', JSON.stringify(current));
        loadSavedList();
      });

      [...saleTypeRadios, ...typeRadios, ...unitRadios, commissionInput, serviceFeeInput, salePriceInput, ownerPaymentInput, ...modeRadios].forEach(el => el.addEventListener('input', calculateProfit));
      saleTypeRadios.forEach(r => r.addEventListener('change', updateVisibilityBySaleType));
      modeRadios.forEach(r => r.addEventListener('change', updateFormMode));

      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      document.getElementById('saleDate').value = `${yyyy}-${mm}-${dd}`;
      document.getElementById('deliveryDate').value = `${yyyy}-${mm}-${dd}`;

      updateVisibilityBySaleType();
      updateFormMode();
      calculateProfit();
      loadSavedList();
    });
  </script>
</body>
</html>
